name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies (CPU-only torch)
        run: pip install -r requirements-dev.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Run tests
        run: pytest -q
