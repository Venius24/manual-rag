services:

  postgres:
    image: pgvector/pgvector:pg16

    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5433:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rag"]
      interval: 5s
      timeout: 5s
      retries: 10


  api:
    build: .

    ports:
      - "8000:8000"

    environment:
      DB_URL: postgresql://postgres:postgres@postgres:5432/rag
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      RETRIEVAL_MODE: ${RETRIEVAL_MODE:-hybrid}

    depends_on:
      postgres:
        condition: service_healthy


volumes:
  pgdata: